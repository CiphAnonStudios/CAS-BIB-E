<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doesn't Connect</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
    }

    img {
      max-width: 100%;
      max-height: 100vh;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img id="image" src="DoesntConnect1.png" alt="Image" />
  <script>
    const images = [
      "images/DoesntConnect1.png",
      "images/DoesntConnect2.png" // Change this to your second image filename
    ];

    let currentImage = 0;
    const image = document.getElementById("image");

    setInterval(() => {
      currentImage = (currentImage + 1) % images.length;
      image.src = images[currentImage];
    }, 500); // Switches every 3 seconds
  </script>
</body>
</html>
